{% set version = "0.9.0" %}

package:
  name: xgcm
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/x/xgcm/xgcm-{{ version }}.tar.gz
  sha256: 7406a87bc619841ff5afc23da1521142642c766a583c6cdd57bd78a487950e2c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - dask
    - future
    - numpy
    - xarray >=0.20.0

test:
  imports:
    - xgcm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/xgcm/xgcm
  license: MIT
  license_file: LICENSE
  summary: General Circulation Model Postprocessing with xarray

extra:
  recipe-maintainers:
    - ocefpaf
    - jbusecke
    - rabernat
    - hdrake
    - NoraLoose
